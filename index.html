<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1120" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Zyn Log</title>
<style>
  :root {
    --bg: #0b1120; --card: #172033; --card-hi: #1e293b; --line: #263449;
    --text: #e8eef7; --muted: #93a3b8; --accent: #34d399; --accent-dim: #10b981;
    --radius: 18px; --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #14213b 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh; -webkit-font-smoothing: antialiased;
    padding: max(20px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  header { text-align: center; margin: 6px 0 18px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

  .card {
    background: linear-gradient(180deg, var(--card-hi), var(--card));
    border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px;
  }

  .hero { text-align: center; padding: 26px 18px; }
  .hero .count {
    font-size: 84px; font-weight: 800; line-height: 1;
    background: linear-gradient(180deg, #fff, #cbd5e1);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero .label { color: var(--muted); font-size: 15px; margin-top: 8px; }

  .btn-row { display: flex; gap: 12px; margin-top: 22px; }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn { padding: 18px; border-radius: 14px; font-size: 17px; font-weight: 700; transition: transform .06s ease; }
  .btn:active { transform: scale(.97); }
  .btn-primary { flex: 1; background: linear-gradient(180deg, var(--accent), var(--accent-dim)); color: #04231a; }
  .btn-ghost { flex: 0 0 92px; background: var(--card-hi); color: var(--text); border: 1px solid var(--line); }
  .btn-ghost:disabled { opacity: .4; cursor: default; }

  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin: 4px 2px 12px; }

  .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row .t { font-size: 15px; }
  .row .d { color: var(--muted); font-size: 12px; }
  .row .n { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .row button { background: transparent; color: var(--muted); font-size: 13px; padding: 6px 10px; border-radius: 8px; }
  .row button:active { background: var(--card-hi); }
  .row.today { color: var(--accent); font-weight: 600; }
  .empty { color: var(--muted); }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: var(--card-hi); border: 1px solid var(--line); color: var(--text);
    padding: 12px 18px; border-radius: 999px; font-size: 14px; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .forecast-main { font-size: 20px; font-weight: 700; line-height: 1.35; }
  .forecast-main .date { color: var(--accent); }
  .forecast-sub { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .tally { margin-top: 14px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .tally b { color: var(--text); font-weight: 700; }
  .tally .dot { opacity: .5; margin: 0 8px; }

  details.settings { margin-bottom: 14px; }
  details.settings summary { cursor: pointer; list-style: none; color: var(--muted); font-size: 13px; text-align: center; padding: 6px; }
  details.settings summary::-webkit-details-marker { display: none; }
  .setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; }
  .setrow label { font-size: 14px; color: var(--muted); }
  .setrow input { width: 110px; padding: 10px 12px; border-radius: 10px; background: #0c1424; border: 1px solid var(--line); color: var(--text); font-size: 16px; font-family: inherit; text-align: right; }
  .setrow input:focus { outline: none; border-color: var(--accent-dim); }

  .foot { text-align: center; color: var(--muted); font-size: 11px; margin-top: 10px; line-height: 1.7; }
  .foot button { background: none; color: var(--muted); font-size: 11px; text-decoration: underline; padding: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Zyn Log</h1>
    <p>One tap per pouch. That's it.</p>
  </header>

  <div class="card hero">
    <div class="count" id="todayCount">0</div>
    <div class="label" id="todayLabel">pouches today</div>
    <div class="tally" id="tally"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="logBtn">+ Log a pouch</button>
      <button class="btn btn-ghost" id="undoBtn" disabled>Undo</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Quit forecast</div>
    <div class="forecast-main" id="forecastMain">—</div>
    <div class="forecast-sub" id="forecastSub"></div>
  </div>

  <div class="card">
    <div class="section-title">Today</div>
    <div id="todayLog"><div class="row"><div class="t empty">No pouches logged yet today.</div></div></div>
  </div>

  <div class="card">
    <div class="section-title">Last 7 days</div>
    <div id="history"></div>
  </div>

  <details class="settings">
    <summary>⚙︎ Adjust nicotine &amp; price</summary>
    <div class="card" style="margin-top:10px">
      <div class="setrow">
        <label for="setMg">Nicotine per pouch (mg)</label>
        <input type="number" id="setMg" min="0" step="0.5" inputmode="decimal" />
      </div>
      <div class="setrow">
        <label for="setPrice">Price per pouch ($)</label>
        <input type="number" id="setPrice" min="0" step="0.01" inputmode="decimal" placeholder="off" />
      </div>
      <div style="color:var(--muted);font-size:12px;margin-top:6px">Leave price blank or 0 to hide the cost line.</div>
    </div>
  </details>

  <div class="foot">
    Everything is stored privately on this device.<br />
    <button id="exportBtn">Export</button> · <button id="resetBtn">Reset</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var STORE = "zynlog.v1";
  var state = load();

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE) || "{}");
      return {
        logs: s.logs || {},
        mgPerPouch: typeof s.mgPerPouch === "number" ? s.mgPerPouch : 3,
        pricePerPouch: typeof s.pricePerPouch === "number" ? s.pricePerPouch : 0
      };
    } catch (e) { return { logs: {}, mgPerPouch: 3, pricePerPouch: 0 }; }
  }
  function save() { localStorage.setItem(STORE, JSON.stringify(state)); }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function keyFor(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayKey() { return keyFor(new Date()); }
  function keyMinus(days) { var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - days); return keyFor(d); }
  function countOn(k) { return (state.logs[k] || []).length; }

  function logPouch() {
    var k = todayKey();
    if (!state.logs[k]) state.logs[k] = [];
    state.logs[k].push(Date.now());
    save(); render(); toast("Logged.");
  }
  function undo() {
    var k = todayKey(), arr = state.logs[k];
    if (arr && arr.length) { arr.pop(); if (!arr.length) delete state.logs[k]; save(); render(); toast("Removed."); }
  }
  function removeAt(ts) {
    var k = todayKey(), arr = state.logs[k] || [], i = arr.indexOf(ts);
    if (i > -1) { arr.splice(i, 1); if (!arr.length) delete state.logs[k]; save(); render(); }
  }

  function render() {
    var c = countOn(todayKey());
    $("todayCount").textContent = c;
    $("todayLabel").textContent = c === 1 ? "pouch today" : "pouches today";
    $("undoBtn").disabled = c === 0;
    renderTally(c);
    renderForecast();
    renderTodayLog();
    renderHistory();
  }

  // Project a quit date by fitting a line to recent completed days and
  // finding where that downward trend reaches zero pouches/day.
  function forecast() {
    var keys = Object.keys(state.logs);
    if (!keys.length) return { kind: "none" };
    keys.sort();
    var firstDate = new Date(keys[0] + "T00:00:00");
    var yesterday = new Date(); yesterday.setHours(0, 0, 0, 0); yesterday.setDate(yesterday.getDate() - 1);
    if (yesterday < firstDate) return { kind: "early" }; // only today has data so far

    var winStart = new Date(yesterday); winStart.setDate(winStart.getDate() - 13);
    if (firstDate > winStart) winStart = firstDate;

    var series = [];
    for (var d = new Date(winStart); d <= yesterday; d.setDate(d.getDate() + 1)) {
      series.push(countOn(keyFor(d)));
    }
    var n = series.length;
    if (n < 4) return { kind: "early", have: n };

    var sx = 0, sy = 0, sxx = 0, sxy = 0;
    for (var i = 0; i < n; i++) { sx += i; sy += series[i]; sxx += i * i; sxy += i * series[i]; }
    var denom = n * sxx - sx * sx;
    if (denom === 0) return { kind: "early", have: n };
    var slope = (n * sxy - sx * sy) / denom;
    var intercept = (sy - slope * sx) / n;
    var level = slope * (n - 1) + intercept; // fitted count at the most recent day
    if (level < 0) level = 0;

    if (level <= 0.5) return { kind: "almost" };
    if (slope >= -0.03) return { kind: "flat" };         // essentially not declining
    var daysToZero = level / (-slope);
    if (daysToZero > 3650) return { kind: "slow" };      // >10 years ≈ flat

    var eta = new Date(yesterday); eta.setDate(eta.getDate() + Math.ceil(daysToZero));
    return { kind: "date", eta: eta, days: Math.ceil(daysToZero), perDay: -slope };
  }

  function fmtAway(days) {
    if (days <= 1) return "tomorrow";
    if (days <= 14) return "about " + days + " days away";
    var weeks = Math.round(days / 7);
    if (weeks < 9) return "about " + weeks + " weeks away";
    var months = Math.round(days / 30);
    return "about " + months + " months away";
  }

  function renderForecast() {
    var f = forecast();
    var main = $("forecastMain"), sub = $("forecastSub");
    if (f.kind === "date") {
      var opts = { weekday: "short", month: "short", day: "numeric" };
      main.innerHTML = 'On pace to hit zero around <span class="date">' + f.eta.toLocaleDateString([], opts) + "</span>";
      sub.textContent = fmtAway(f.days) + " · trending down ~" + (Math.round(f.perDay * 10) / 10) + " pouches/day. Stay under yesterday to keep the date moving closer.";
    } else if (f.kind === "flat") {
      main.textContent = "No downward trend yet";
      sub.textContent = "Aim for one less than yesterday — a quit date appears as soon as your count starts falling.";
    } else if (f.kind === "slow") {
      main.textContent = "Trend is nearly flat";
      sub.textContent = "A slightly steeper cut will bring your quit date into view.";
    } else if (f.kind === "almost") {
      main.textContent = "You're basically at zero 🎉";
      sub.textContent = "Incredible. Hold it here and you're done.";
    } else {
      main.textContent = "Building your forecast…";
      sub.textContent = "Log for a few days and your projected quit date shows up here.";
    }
  }

  function renderTally(c) {
    var parts = [];
    var mg = c * (state.mgPerPouch || 0);
    parts.push("<b>" + fmtMg(mg) + "</b> nicotine");
    if (state.pricePerPouch > 0) {
      parts.push("<b>$" + (c * state.pricePerPouch).toFixed(2) + "</b> today");
    }
    $("tally").innerHTML = parts.join('<span class="dot">·</span>');
  }

  function fmtMg(mg) {
    if (mg >= 1000) return (mg / 1000).toFixed(mg % 1000 === 0 ? 0 : 1) + " g";
    return (Math.round(mg * 10) / 10) + " mg";
  }

  function renderTodayLog() {
    var arr = (state.logs[todayKey()] || []).slice().reverse();
    var el = $("todayLog");
    if (!arr.length) { el.innerHTML = '<div class="row"><div class="t empty">No pouches logged yet today.</div></div>'; return; }
    el.innerHTML = "";
    arr.forEach(function (ts, idx) {
      var row = document.createElement("div"); row.className = "row";
      var left = document.createElement("div");
      var t = document.createElement("div"); t.className = "t"; t.textContent = "Pouch #" + (arr.length - idx);
      var d = document.createElement("div"); d.className = "d";
      d.textContent = new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      left.appendChild(t); left.appendChild(d);
      var btn = document.createElement("button"); btn.textContent = "Remove";
      btn.onclick = function () { removeAt(ts); };
      row.appendChild(left); row.appendChild(btn);
      el.appendChild(row);
    });
  }

  function renderHistory() {
    var el = $("history"); el.innerHTML = "";
    var names = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    for (var i = 0; i < 7; i++) {
      var k = keyMinus(i), c = countOn(k), d = new Date(k + "T00:00:00");
      var row = document.createElement("div"); row.className = "row" + (i === 0 ? " today" : "");
      var t = document.createElement("div"); t.className = "t";
      t.textContent = i === 0 ? "Today" : (i === 1 ? "Yesterday" : names[d.getDay()] + " " + (d.getMonth()+1) + "/" + d.getDate());
      var n = document.createElement("div"); n.className = "n";
      n.textContent = c + (c === 1 ? " pouch" : " pouches");
      row.appendChild(t); row.appendChild(n);
      el.appendChild(row);
    }
  }

  function exportData() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = "zynlog-" + todayKey() + ".json"; a.click(); URL.revokeObjectURL(url);
  }
  function resetAll() {
    if (!confirm("Erase all logged pouches? This cannot be undone.")) return;
    state = { logs: {}, mgPerPouch: state.mgPerPouch, pricePerPouch: state.pricePerPouch };
    save(); render(); toast("Reset.");
  }

  function num(v, dflt) { v = parseFloat(v); return isNaN(v) || v < 0 ? dflt : v; }
  function syncSettingsFields() {
    $("setMg").value = state.mgPerPouch;
    $("setPrice").value = state.pricePerPouch > 0 ? state.pricePerPouch : "";
  }
  function onSettingChange() {
    state.mgPerPouch = num($("setMg").value, 0);
    state.pricePerPouch = num($("setPrice").value, 0);
    save(); render();
  }

  function $(id) { return document.getElementById(id); }
  var toastTimer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  $("logBtn").onclick = logPouch;
  $("undoBtn").onclick = undo;
  $("exportBtn").onclick = exportData;
  $("resetBtn").onclick = resetAll;
  $("setMg").oninput = onSettingChange;
  $("setPrice").oninput = onSettingChange;
  syncSettingsFields();
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "l" || e.key === "L") logPouch();
    if (e.key === "z" || e.key === "Z") undo();
  });

  var lastDay = todayKey();
  setInterval(function () { if (lastDay !== todayKey()) { lastDay = todayKey(); render(); } }, 30000);
  render();
})();
</script>
</body>
</html>
