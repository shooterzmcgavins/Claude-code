<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PriceLens — snap it, price it</title>
<style>
  :root {
    --bg: #131714;
    --card: #1b211c;
    --ink: #e6eae5;
    --ink-soft: #93a096;
    --rule: #2b342d;
    --green: #52b788;
    --green-deep: #2d6a4f;
    --amber: #e0a458;
    --red: #e07a5f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 16px; line-height: 1.45;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  main { max-width: 480px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
  h1 { font-size: 1.35rem; margin: 0; display: flex; align-items: center; gap: 0.5rem; }
  .tagline { color: var(--ink-soft); font-size: 0.85rem; margin: 0.2rem 0 1.25rem; }
  .gear { margin-left: auto; background: none; border: 1px solid var(--rule); color: var(--ink-soft);
    border-radius: 8px; padding: 0.35rem 0.6rem; font-size: 0.8rem; cursor: pointer; }

  .snap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.4rem; width: 100%; min-height: 150px; border: 2px dashed var(--rule);
    border-radius: 14px; background: var(--card); color: var(--ink-soft);
    font-size: 1rem; cursor: pointer; padding: 1rem;
  }
  .snap strong { color: var(--green); font-size: 1.1rem; }
  .snap img { max-width: 100%; max-height: 260px; border-radius: 10px; }
  input[type="file"] { display: none; }

  textarea {
    width: 100%; margin-top: 0.75rem; background: var(--card); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 10px; padding: 0.7rem 0.85rem;
    font: inherit; font-size: 0.95rem; resize: vertical; min-height: 2.9rem;
  }
  textarea::placeholder { color: var(--ink-soft); }

  .go {
    width: 100%; margin-top: 0.75rem; background: var(--green-deep); color: #fff;
    border: none; border-radius: 10px; padding: 0.9rem; font-size: 1.05rem;
    font-weight: 700; cursor: pointer;
  }
  .go:disabled { opacity: 0.45; }

  .status { margin-top: 1rem; color: var(--ink-soft); font-size: 0.9rem; min-height: 1.2rem; }

  .result { margin-top: 1rem; background: var(--card); border: 1px solid var(--rule);
    border-radius: 14px; padding: 1.1rem 1.2rem; }
  .verdict { font-size: 1.5rem; font-weight: 800; letter-spacing: 0.02em; }
  .verdict.GRAB { color: var(--green); }
  .verdict.MAYBE { color: var(--amber); }
  .verdict.PASS { color: var(--red); }
  .item-name { font-size: 1.05rem; font-weight: 600; margin: 0.2rem 0 0.8rem; }
  .source-tag { display: inline-block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; border-radius: 4px; padding: 0.15rem 0.45rem; margin-bottom: 0.6rem; }
  .source-tag.live { background: rgba(82,183,136,0.15); color: var(--green); }
  .source-tag.est { background: rgba(224,164,88,0.15); color: var(--amber); }
  .rows { display: grid; grid-template-columns: auto 1fr; gap: 0.3rem 1rem; font-size: 0.95rem; }
  .rows dt { color: var(--ink-soft); }
  .rows dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .maxbuy { margin-top: 0.9rem; padding-top: 0.8rem; border-top: 1px solid var(--rule);
    display: flex; justify-content: space-between; align-items: baseline; }
  .maxbuy .label { color: var(--ink-soft); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .maxbuy .val { font-size: 1.6rem; font-weight: 800; color: var(--green); font-variant-numeric: tabular-nums; }
  .notes { margin-top: 0.8rem; font-size: 0.9rem; color: var(--ink-soft); }
  .comps { margin-top: 0.9rem; border-top: 1px solid var(--rule); padding-top: 0.7rem; }
  .comps h3 { margin: 0 0 0.4rem; font-size: 0.75rem; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.08em; }
  .comps ul { margin: 0; padding: 0; list-style: none; font-size: 0.85rem; }
  .comps li { display: flex; justify-content: space-between; gap: 0.75rem; padding: 0.15rem 0; }
  .comps li span:first-child { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .comps li span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .raw { margin-top: 1rem; font-size: 0.85rem; white-space: pre-wrap; }
  .ebay-link { display: block; margin-top: 0.9rem; text-align: center; color: var(--green);
    font-weight: 600; font-size: 0.95rem; text-decoration: none; border: 1px solid var(--rule);
    border-radius: 10px; padding: 0.6rem; }

  dialog {
    background: var(--card); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 14px; padding: 1.25rem; width: min(420px, 92vw);
  }
  dialog::backdrop { background: rgba(0,0,0,0.6); }
  dialog h2 { margin: 0 0 0.6rem; font-size: 1.1rem; }
  dialog p { font-size: 0.85rem; color: var(--ink-soft); }
  dialog input {
    width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 8px; padding: 0.6rem 0.75rem; font: inherit; font-size: 0.9rem;
  }
  dialog button { margin-top: 0.8rem; background: var(--green-deep); color: #fff; border: none;
    border-radius: 8px; padding: 0.6rem 1.1rem; font: inherit; font-weight: 600; cursor: pointer; }
  .err { color: var(--red); }
</style>
</head>
<body>
<main>
  <h1>🔎 PriceLens <button class="gear" id="gearBtn">API key</button></h1>
  <p class="tagline">Snap a photo → real eBay sold comps, fees, and your max buy price.</p>

  <label class="snap" id="snapZone">
    <span id="snapHint"><strong>Tap to snap or choose a photo</strong><br>whole item + maker's mark works best</span>
    <input type="file" id="photo" accept="image/*" capture="environment">
  </label>

  <textarea id="note" placeholder="Optional: brand/model, condition, asking price… e.g. “Penn 704Z, handle turns fine, they want $15”"></textarea>

  <button class="go" id="goBtn" disabled>What's it worth?</button>
  <div class="status" id="status"></div>
  <div id="out"></div>

  <dialog id="keyDialog">
    <h2>Anthropic API key</h2>
    <p>Stored only in this browser (localStorage). Get one at console.anthropic.com → API keys. Each appraisal costs a few cents.</p>
    <input type="password" id="keyInput" placeholder="sk-ant-...">
    <button id="keySave">Save</button>
  </dialog>
</main>

<script>
const $ = (id) => document.getElementById(id);
let imageData = null; // { media_type, data }

// When the page is served by server.js, /comps is same-origin and gives us
// real eBay sold-listing data. Opened as a bare file, we fall back to the
// model's own web search.
const HAS_COMPS_SERVER = location.protocol.startsWith("http");

// ----- API key management -----
const keyDialog = $("keyDialog");
$("gearBtn").onclick = () => { $("keyInput").value = localStorage.getItem("plens_key") || ""; keyDialog.showModal(); };
$("keySave").onclick = () => {
  const k = $("keyInput").value.trim();
  if (k) localStorage.setItem("plens_key", k);
  keyDialog.close();
  updateGo();
};

// ----- Photo handling: downscale to control token cost -----
$("photo").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.src = URL.createObjectURL(file);
  await img.decode();
  const MAX = 1200;
  const scale = Math.min(1, MAX / Math.max(img.width, img.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(img.width * scale);
  canvas.height = Math.round(img.height * scale);
  canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
  imageData = { media_type: "image/jpeg", data: dataUrl.split(",")[1] };
  $("snapHint").innerHTML = "";
  const preview = document.createElement("img");
  preview.src = dataUrl;
  $("snapHint").appendChild(preview);
  URL.revokeObjectURL(img.src);
  updateGo();
});

function updateGo() {
  $("goBtn").disabled = !(imageData && localStorage.getItem("plens_key"));
  if (!localStorage.getItem("plens_key")) $("status").textContent = "Set your API key first (top right).";
  else if (!imageData) $("status").textContent = "";
}

// ----- Claude call helper -----
async function claude(body) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": localStorage.getItem("plens_key"),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const b = await res.json().catch(() => ({}));
    throw new Error(b?.error?.message || `HTTP ${res.status}`);
  }
  const msg = await res.json();
  if (msg.stop_reason === "refusal") throw new Error("The model declined this request.");
  return msg.content.filter(b => b.type === "text").map(b => b.text).join("\n");
}

function lastJson(text) {
  const start = text.lastIndexOf("{");
  if (start === -1) return null;
  try { return JSON.parse(text.slice(start, text.lastIndexOf("}") + 1)); } catch { return null; }
}

// ----- Stage 1: identification (vision only, fast) -----
const IDENTIFY_PROMPT = (note) => `Identify the item in this photo for a resale flipper. Be as specific as brand/model/era allows.
User note: ${note || "(none)"}

Reply with ONLY a JSON object, no code fence:
{"item":"precise name","search_query":"the exact search string a reseller would type into eBay to find this item's sold listings (brand + model, no filler words)","confidence":"high|medium|low","platform":"eBay|Mercari|Facebook local|Poshmark","ship_cost":0,"asking_price":null,"notes":"one short sentence: condition observations from the photo, repro/damage tells to check"}

platform: eBay for collectibles/vintage/anything searched by model number; Facebook local for heavy or bulky items (ship_cost 0); Mercari for generic mid-priced goods; Poshmark for fashion.
ship_cost: your estimate in USD of what shipping this item costs the seller (0 if Facebook local).
asking_price: the number if the user's note mentions what the seller wants, else null.`;

// ----- Stage 2 fallback: model-run web search when no comps server -----
const FALLBACK_PROMPT = (note) => `You are a resale arbitrage appraiser. Identify the item in the photo, then use web search to find what it has RECENTLY SOLD for (sold listings, not asking prices). Pick the best platform: eBay (13.6% + $0.40 fee on item+shipping), Mercari (10%), Facebook Marketplace local (0%), Poshmark (20%, fashion). Max buy = one third of net after fees/shipping.
User note: ${note || "(none)"}
End your reply with ONLY a JSON object on the final lines, no code fence:
{"item":"...","confidence":"high|medium|low","sell_low":0,"sell_high":0,"platform":"...","fees_and_shipping":0,"net_mid":0,"max_buy":0,"verdict":"GRAB|MAYBE|PASS","notes":"short: comps found, what to check in person"}`;

// ----- Fee math (deterministic, runs locally) -----
function feeMath(platform, price, shipCost) {
  let fees = 0, ship = shipCost || 0;
  if (/ebay/i.test(platform)) fees = 0.136 * (price + ship) + 0.40;
  else if (/mercari/i.test(platform)) fees = 0.10 * price;
  else if (/poshmark/i.test(platform)) { fees = price < 15 ? 2.95 : 0.20 * price; ship = 0; }
  else { fees = 0; ship = 0; } // Facebook local
  return { fees, ship, net: price - fees - ship };
}

function verdictFor(asking, maxBuy, confidence) {
  if (confidence === "low") return "MAYBE";
  if (asking == null) return "MAYBE";
  if (asking <= maxBuy) return "GRAB";
  if (asking <= maxBuy * 1.25) return "MAYBE";
  return "PASS";
}

// ----- Main flow -----
$("goBtn").onclick = async () => {
  $("goBtn").disabled = true;
  $("out").innerHTML = "";
  const note = $("note").value.trim();
  try {
    if (HAS_COMPS_SERVER) {
      $("status").textContent = "Identifying…";
      const identText = await claude({
        model: "claude-opus-5",
        max_tokens: 2000,
        messages: [{ role: "user", content: [
          { type: "image", source: { type: "base64", media_type: imageData.media_type, data: imageData.data } },
          { type: "text", text: IDENTIFY_PROMPT(note) },
        ]}],
      });
      const ident = lastJson(identText);
      if (!ident?.search_query) throw new Error("Couldn't identify the item — try a clearer photo of the maker's mark.");

      $("status").textContent = `Identified: ${ident.item} — pulling real eBay sold comps…`;
      const comps = await fetch(`/comps?q=${encodeURIComponent(ident.search_query)}`).then(r => r.json());

      if (comps.count >= 3) {
        const { fees, ship, net } = feeMath(ident.platform, comps.median, ident.ship_cost);
        const maxBuy = Math.max(0, net / 3);
        renderCard({
          verdict: verdictFor(ident.asking_price, maxBuy, ident.confidence),
          item: ident.item, confidence: ident.confidence,
          sell_low: comps.low, sell_high: comps.high, mid: comps.median,
          platform: ident.platform, fees_and_shipping: fees + ship,
          net_mid: net, max_buy: maxBuy, notes: ident.notes,
          comps, source: "live", search_query: ident.search_query,
        });
        $("status").textContent = "";
        return;
      }
      $("status").textContent = `Only ${comps.count ?? 0} eBay comps found — falling back to web-search estimate…`;
    }

    // Fallback: single call with model-run web search
    $("status").textContent = HAS_COMPS_SERVER ? $("status").textContent : "Identifying and searching sold prices… (15–60s)";
    const text = await claude({
      model: "claude-opus-5",
      max_tokens: 6000,
      tools: [{ type: "web_search_20260209", name: "web_search", max_uses: 5 }],
      messages: [{ role: "user", content: [
        { type: "image", source: { type: "base64", media_type: imageData.media_type, data: imageData.data } },
        { type: "text", text: FALLBACK_PROMPT(note) },
      ]}],
    });
    const d = lastJson(text);
    if (!d?.verdict) {
      $("out").innerHTML = `<div class="result"><div class="raw">${escapeHtml(text)}</div></div>`;
    } else {
      renderCard({
        verdict: d.verdict, item: d.item, confidence: d.confidence,
        sell_low: d.sell_low, sell_high: d.sell_high, mid: (d.sell_low + d.sell_high) / 2,
        platform: d.platform, fees_and_shipping: d.fees_and_shipping,
        net_mid: d.net_mid, max_buy: d.max_buy, notes: d.notes,
        comps: null, source: "est", search_query: d.item,
      });
    }
    $("status").textContent = "";
  } catch (err) {
    $("status").innerHTML = `<span class="err">${escapeHtml(err.message)}</span>`;
  } finally {
    $("goBtn").disabled = false;
  }
};

function renderCard(d) {
  const money = (n) => "$" + Number(n).toFixed(0);
  const compsHtml = d.comps?.samples?.length
    ? `<div class="comps"><h3>Recent eBay solds (${d.comps.count} found)</h3><ul>` +
      d.comps.samples.map(s => `<li><span>${escapeHtml(s.title)}</span><span>${money(s.price)}</span></li>`).join("") +
      `</ul></div>`
    : "";
  $("out").innerHTML = `
    <div class="result">
      <div class="verdict ${escapeHtml(d.verdict)}">${escapeHtml(d.verdict)}</div>
      <div class="item-name">${escapeHtml(d.item)} <span style="color:var(--ink-soft);font-weight:400">· ${escapeHtml(d.confidence)} confidence</span></div>
      <span class="source-tag ${d.source === "live" ? "live" : "est"}">${d.source === "live" ? "real eBay sold data" : "web-search estimate"}</span>
      <dl class="rows">
        <dt>Sold range</dt><dd>${money(d.sell_low)}–${money(d.sell_high)}</dd>
        <dt>Typical (median)</dt><dd>${money(d.mid)}</dd>
        <dt>Best platform</dt><dd>${escapeHtml(d.platform)}</dd>
        <dt>Fees + shipping</dt><dd>−${money(d.fees_and_shipping)}</dd>
        <dt>Net profit basis</dt><dd>${money(d.net_mid)}</dd>
      </dl>
      <div class="maxbuy"><span class="label">Max buy price</span><span class="val">${money(d.max_buy)}</span></div>
      <div class="notes">${escapeHtml(d.notes || "")}</div>
      ${compsHtml}
      <a class="ebay-link" href="https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(d.search_query)}&LH_Sold=1&LH_Complete=1" target="_blank" rel="noopener">
        Open on eBay →
      </a>
    </div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

updateGo();
</script>
</body>
</html>
