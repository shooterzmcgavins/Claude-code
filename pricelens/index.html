<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PriceLens — snap it, price it</title>
<style>
  :root {
    --bg: #131714;
    --card: #1b211c;
    --ink: #e6eae5;
    --ink-soft: #93a096;
    --rule: #2b342d;
    --green: #52b788;
    --green-deep: #2d6a4f;
    --amber: #e0a458;
    --red: #e07a5f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 16px; line-height: 1.45;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  main { max-width: 480px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
  h1 { font-size: 1.35rem; margin: 0; display: flex; align-items: center; gap: 0.5rem; }
  .tagline { color: var(--ink-soft); font-size: 0.85rem; margin: 0.2rem 0 1.25rem; }
  .gear { margin-left: auto; background: none; border: 1px solid var(--rule); color: var(--ink-soft);
    border-radius: 8px; padding: 0.35rem 0.6rem; font-size: 0.8rem; cursor: pointer; }

  .snap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.4rem; width: 100%; min-height: 150px; border: 2px dashed var(--rule);
    border-radius: 14px; background: var(--card); color: var(--ink-soft);
    font-size: 1rem; cursor: pointer; padding: 1rem;
  }
  .snap strong { color: var(--green); font-size: 1.1rem; }
  .snap img { max-width: 100%; max-height: 260px; border-radius: 10px; }
  input[type="file"] { display: none; }

  textarea {
    width: 100%; margin-top: 0.75rem; background: var(--card); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 10px; padding: 0.7rem 0.85rem;
    font: inherit; font-size: 0.95rem; resize: vertical; min-height: 2.9rem;
  }
  textarea::placeholder { color: var(--ink-soft); }

  .go {
    width: 100%; margin-top: 0.75rem; background: var(--green-deep); color: #fff;
    border: none; border-radius: 10px; padding: 0.9rem; font-size: 1.05rem;
    font-weight: 700; cursor: pointer;
  }
  .go:disabled { opacity: 0.45; }

  .status { margin-top: 1rem; color: var(--ink-soft); font-size: 0.9rem; min-height: 1.2rem; }

  .result { margin-top: 1rem; background: var(--card); border: 1px solid var(--rule);
    border-radius: 14px; padding: 1.1rem 1.2rem; }
  .verdict { font-size: 1.5rem; font-weight: 800; letter-spacing: 0.02em; }
  .verdict.GRAB { color: var(--green); }
  .verdict.MAYBE { color: var(--amber); }
  .verdict.PASS { color: var(--red); }
  .item-name { font-size: 1.05rem; font-weight: 600; margin: 0.2rem 0 0.8rem; }
  .rows { display: grid; grid-template-columns: auto 1fr; gap: 0.3rem 1rem; font-size: 0.95rem; }
  .rows dt { color: var(--ink-soft); }
  .rows dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .maxbuy { margin-top: 0.9rem; padding-top: 0.8rem; border-top: 1px solid var(--rule);
    display: flex; justify-content: space-between; align-items: baseline; }
  .maxbuy .label { color: var(--ink-soft); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .maxbuy .val { font-size: 1.6rem; font-weight: 800; color: var(--green); font-variant-numeric: tabular-nums; }
  .notes { margin-top: 0.8rem; font-size: 0.9rem; color: var(--ink-soft); }
  .raw { margin-top: 1rem; font-size: 0.85rem; white-space: pre-wrap; }

  dialog {
    background: var(--card); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 14px; padding: 1.25rem; width: min(420px, 92vw);
  }
  dialog::backdrop { background: rgba(0,0,0,0.6); }
  dialog h2 { margin: 0 0 0.6rem; font-size: 1.1rem; }
  dialog p { font-size: 0.85rem; color: var(--ink-soft); }
  dialog input {
    width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 8px; padding: 0.6rem 0.75rem; font: inherit; font-size: 0.9rem;
  }
  dialog button { margin-top: 0.8rem; background: var(--green-deep); color: #fff; border: none;
    border-radius: 8px; padding: 0.6rem 1.1rem; font: inherit; font-weight: 600; cursor: pointer; }
  .err { color: var(--red); }
</style>
</head>
<body>
<main>
  <h1>🔎 PriceLens <button class="gear" id="gearBtn">API key</button></h1>
  <p class="tagline">Snap a photo → recent sold prices, fees, and your max buy price.</p>

  <label class="snap" id="snapZone">
    <span id="snapHint"><strong>Tap to snap or choose a photo</strong><br>whole item + maker's mark works best</span>
    <input type="file" id="photo" accept="image/*" capture="environment">
  </label>

  <textarea id="note" placeholder="Optional: brand/model, condition, asking price… e.g. “Penn 704Z, handle turns fine, they want $15”"></textarea>

  <button class="go" id="goBtn" disabled>What's it worth?</button>
  <div class="status" id="status"></div>
  <div id="out"></div>

  <dialog id="keyDialog">
    <h2>Anthropic API key</h2>
    <p>Stored only in this browser (localStorage). Get one at console.anthropic.com → API keys. Each appraisal costs a few cents.</p>
    <input type="password" id="keyInput" placeholder="sk-ant-...">
    <button id="keySave">Save</button>
  </dialog>
</main>

<script>
const $ = (id) => document.getElementById(id);
let imageData = null; // { media_type, data }

// ----- API key management -----
const keyDialog = $("keyDialog");
$("gearBtn").onclick = () => { $("keyInput").value = localStorage.getItem("plens_key") || ""; keyDialog.showModal(); };
$("keySave").onclick = () => {
  const k = $("keyInput").value.trim();
  if (k) localStorage.setItem("plens_key", k);
  keyDialog.close();
  updateGo();
};

// ----- Photo handling: downscale to control token cost -----
$("photo").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.src = URL.createObjectURL(file);
  await img.decode();
  const MAX = 1200;
  const scale = Math.min(1, MAX / Math.max(img.width, img.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(img.width * scale);
  canvas.height = Math.round(img.height * scale);
  canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
  imageData = { media_type: "image/jpeg", data: dataUrl.split(",")[1] };
  $("snapHint").innerHTML = "";
  const preview = document.createElement("img");
  preview.src = dataUrl;
  $("snapHint").appendChild(preview);
  URL.revokeObjectURL(img.src);
  updateGo();
});

function updateGo() {
  $("goBtn").disabled = !(imageData && localStorage.getItem("plens_key"));
  if (!localStorage.getItem("plens_key")) $("status").textContent = "Set your API key first (top right).";
  else if (!imageData) $("status").textContent = "";
}

// ----- The appraisal call -----
const PROMPT = (note) => `You are a resale arbitrage appraiser for a flipper in New Bern, NC with a small bankroll.

1. Identify the item in the photo as precisely as you can (brand, model, era). Use the user's note if given.
2. Use web search to find what this item has RECENTLY SOLD for (eBay sold listings, price guides, recent sales data — not asking prices).
3. Pick the best selling platform: eBay (13.6% + $0.40 fee, on item + shipping), Mercari (10%), Facebook Marketplace local (0%, no shipping), Poshmark (20%, fashion only). Heavy/bulky = sell local.
4. Estimate: realistic sell price range, fees, shipping cost if shipped, net profit at the midpoint.
5. Max buy price = one third of expected net resale (after fees/shipping). Verdict: GRAB if the note's asking price (or a typical thrift price) is at/under max buy; MAYBE if close or identification is uncertain; PASS otherwise.

User note: ${note || "(none)"}

After your research, end your reply with ONLY a JSON object on the final lines, no code fence, exactly this shape:
{"item":"...","confidence":"high|medium|low","sell_low":0,"sell_high":0,"platform":"...","fees_and_shipping":0,"net_mid":0,"max_buy":0,"verdict":"GRAB|MAYBE|PASS","notes":"one or two short sentences: key comps found, condition caveats, what to double-check in person"}`;

$("goBtn").onclick = async () => {
  const key = localStorage.getItem("plens_key");
  $("goBtn").disabled = true;
  $("out").innerHTML = "";
  $("status").textContent = "Identifying and searching sold prices… (15–60s)";
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-opus-5",
        max_tokens: 6000,
        tools: [{ type: "web_search_20260209", name: "web_search", max_uses: 5 }],
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: imageData.media_type, data: imageData.data } },
            { type: "text", text: PROMPT($("note").value.trim()) },
          ],
        }],
      }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body?.error?.message || `HTTP ${res.status}`);
    }
    const msg = await res.json();
    if (msg.stop_reason === "refusal") throw new Error("The model declined this request.");
    const text = msg.content.filter(b => b.type === "text").map(b => b.text).join("\n");
    render(text);
    $("status").textContent = "";
  } catch (err) {
    $("status").innerHTML = `<span class="err">${escapeHtml(err.message)}</span>` +
      (String(err.message).includes("Failed to fetch")
        ? '<br><span>Network/CORS error — check your connection, or that the key is valid.</span>' : "");
  } finally {
    $("goBtn").disabled = false;
  }
};

function render(text) {
  // The JSON object is on the final lines; find the last {...} span.
  let data = null;
  const start = text.lastIndexOf("{");
  if (start !== -1) {
    try { data = JSON.parse(text.slice(start, text.lastIndexOf("}") + 1)); } catch (_) {}
  }
  const out = $("out");
  if (!data || !data.verdict) {
    out.innerHTML = `<div class="result"><div class="raw">${escapeHtml(text)}</div></div>`;
    return;
  }
  const money = (n) => "$" + Number(n).toFixed(0);
  out.innerHTML = `
    <div class="result">
      <div class="verdict ${escapeHtml(data.verdict)}">${escapeHtml(data.verdict)}</div>
      <div class="item-name">${escapeHtml(data.item)} <span style="color:var(--ink-soft);font-weight:400">· ${escapeHtml(data.confidence)} confidence</span></div>
      <dl class="rows">
        <dt>Sells for</dt><dd>${money(data.sell_low)}–${money(data.sell_high)}</dd>
        <dt>Best platform</dt><dd>${escapeHtml(data.platform)}</dd>
        <dt>Fees + shipping</dt><dd>−${money(data.fees_and_shipping)}</dd>
        <dt>Net (midpoint)</dt><dd>${money(data.net_mid)}</dd>
      </dl>
      <div class="maxbuy"><span class="label">Max buy price</span><span class="val">${money(data.max_buy)}</span></div>
      <div class="notes">${escapeHtml(data.notes || "")}</div>
    </div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

updateGo();
</script>
</body>
</html>
